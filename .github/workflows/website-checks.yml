name: Website checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: PHP and JavaScript syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tracked source files
        shell: bash
        run: |
          set -euo pipefail
          php --version
          node --version
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          checked = 0
          failures = []
          for name in filter(None, files):
              path = Path(name)
              if {'vendor', 'node_modules'}.intersection(path.parts):
                  continue
              command = {'php': ['php', '-l'], 'js': ['node', '--check'],
                         'mjs': ['node', '--check'], 'cjs': ['node', '--check']}.get(path.suffix[1:])
              if command is None:
                  continue
              checked += 1
              result = subprocess.run(command + ['./' + name], check=False)
              if result.returncode:
                  failures.append(name)
          summary = f'Checked {checked} PHP/JavaScript files.\n'
          if checked == 0:
              print('::warning::No theme source yet. Upload the active theme and custom plugins to enable code coverage.')
              summary += '**Theme source is missing: this run does not validate the website code.**\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(summary)
          if failures:
              raise SystemExit('Syntax errors: ' + ', '.join(failures))
          PY

  live-site:
    name: Live website health (not proposed changes)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/caweb-browser"
          cd "$RUNNER_TEMP/caweb-browser"
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.64.1
          npx --no-install playwright install --with-deps chromium
      - name: Test French and English pages on desktop and mobile
        env:
          SITE_URL: https://mastercaweb.unistra.fr/
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/caweb-browser"
          mkdir -p "$GITHUB_WORKSPACE/website-report"
          cat > check.cjs <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const base = new URL(process.env.SITE_URL);
          const reportDir = `${process.env.GITHUB_WORKSPACE}/website-report`;
          const results = [];

          (async () => {
            const browser = await chromium.launch();
            try {
              for (const language of ['fr', 'en']) {
                for (const mobile of [false, true]) {
                  const label = `${language}-${mobile ? 'mobile' : 'desktop'}`;
                  const context = await browser.newContext({
                    viewport: mobile ? { width: 390, height: 844 } : { width: 1440, height: 900 }
                  });
                  const page = await context.newPage();
                  page.setDefaultTimeout(15000);
                  const errors = [];
                  page.on('response', response => {
                    if (new URL(response.url()).origin === base.origin && response.status() >= 400) {
                      errors.push(`HTTP ${response.status()}: ${response.url()}`);
                    }
                  });
                  page.on('requestfailed', request => {
                    if (new URL(request.url()).origin === base.origin &&
                        ['document', 'script', 'stylesheet', 'image'].includes(request.resourceType()) &&
                        !request.failure()?.errorText.includes('ERR_ABORTED')) {
                      errors.push(`Failed request: ${request.url()}`);
                    }
                  });
                  page.on('pageerror', error => {
                    if ((error.stack || '').includes(base.host)) errors.push(error.message);
                  });
                  try {
                    const url = new URL(language === 'en' ? 'en/' : './', base).href;
                    const response = await page.goto(url, { waitUntil: 'load', timeout: 60000 });
                    assert(response?.ok(), `Page did not return a successful response: ${url}`);
                    assert.equal(new URL(page.url()).origin, base.origin, 'Unexpected redirect away from the site');
                    assert((await page.locator('html').getAttribute('lang'))?.startsWith(language), 'Wrong page language');
                    assert((await page.locator('body').innerText()).trim().length > 200, 'Page appears empty');
                    assert(!/Fatal error|Error establishing a database connection|There has been a critical error/i.test(
                      await page.locator('body').innerText()), 'WordPress error displayed');
                    if (mobile) {
                      const button = page.locator('#burger');
                      await button.click();
                      await page.waitForFunction(() => document.querySelector('#burger')?.getAttribute('aria-expanded') === 'true');
                      assert(await page.locator('#main-menu').isVisible(), 'Mobile menu did not open');
                      await button.click();
                      await page.waitForFunction(() => document.querySelector('#burger')?.getAttribute('aria-expanded') === 'false');
                      assert(!(await page.locator('#main-menu').isVisible()), 'Mobile menu did not close');
                    }
                    assert.deepEqual(errors, [], 'Site assets or scripts failed');
                    results.push({ page: label, status: 'passed' });
                    console.log(`PASS ${label}`);
                  } catch (error) {
                    results.push({ page: label, status: 'failed', error: error.message });
                    console.error(`FAIL ${label}: ${error.message}`);
                  } finally {
                    await page.screenshot({ path: `${reportDir}/${label}.png`, fullPage: true }).catch(() => {});
                    await context.close();
                  }
                }
              }
            } finally {
              await browser.close();
              fs.writeFileSync(`${reportDir}/results.json`, JSON.stringify(results, null, 2));
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                '## Current live website\nThese checks test the deployed website, **not the proposed commit**.\n\n' +
                results.map(result => `- ${result.page}: ${result.status}`).join('\n') + '\n');
            }
            if (results.some(result => result.status === 'failed')) process.exitCode = 1;
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
          node check.cjs
      - name: Save screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-report
          path: website-report/
          if-no-files-found: ignore
          retention-days: 7
